<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t"><title id="t">Confirmação de ausência de tensão</title><rect width="640" height="400" rx="26" fill="#101827"/><text x="38" y="47" fill="#fbbf24" font-family="Arial" font-size="22" font-weight="700">VERIFICAÇÃO DE AUSÊNCIA DE TENSÃO</text><g transform="translate(66 102)"><rect width="174" height="220" rx="18" fill="#1e293b" stroke="#64748b" stroke-width="2"/><rect x="25" y="28" width="124" height="54" rx="5" fill="#b8ddb7"/><text x="87" y="64" text-anchor="middle" fill="#16351f" font-family="monospace" font-size="30">0.0 V</text><circle cx="87" cy="128" r="31" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/><path d="M87 99v23M87 139l21 9" stroke="#f59e0b" stroke-width="4"/><path d="M35 220l-20 55M139 220l27 55" stroke="#ef4444" stroke-width="5"/><path d="M35 220l-20 55" stroke="#111827" stroke-width="11"/></g><g transform="translate(304 113)"><rect width="265" height="190" rx="13" fill="#172334" stroke="#334155"/><text x="26" y="38" fill="#22c55e" font-family="Arial" font-weight="700" font-size="16">SEQUÊNCIA SEGURA</text><g fill="#cbd5e1" font-family="Arial" font-size="14"><text x="28" y="78">1. Validar o instrumento</text><text x="28" y="108">2. Medir o ponto liberado</text><text x="28" y="138">3. Confirmar ausência</text><text x="28" y="168">4. Revalidar o instrumento</text></g><circle cx="12" cy="73" r="4" fill="#f59e0b"/><circle cx="12" cy="103" r="4" fill="#f59e0b"/><circle cx="12" cy="133" r="4" fill="#f59e0b"/><circle cx="12" cy="163" r="4" fill="#f59e0b"/></g><text x="41" y="365" fill="#94a3b8" font-family="Arial" font-size="14">A atividade prática ocorre somente após desligamento, bloqueio e verificação.</text></svg>