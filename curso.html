<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso — Eletricista Predial com Ênfase em Energia Desligada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){ var t=localStorage.getItem('eletricista_theme')||'dark'; document.documentElement.setAttribute('data-theme',t); })();</script>
</head>
<body class="curso-body">

<header class="curso-topbar">
  <div class="curso-topbar__left">
    <button class="btn btn-secondary btn-sm" id="sidebarToggle" aria-label="Abrir menu">☰</button>
    <a href="index.html" class="curso-brand">⚡ Eletricista Predial</a>
  </div>
  <div class="curso-topbar__center" id="topbarTitle">Selecione uma lição</div>
  <div class="curso-topbar__right">
    <div class="curso-progress-mini">
      <div class="progress-track" style="width:100px;">
        <div class="progress-fill" id="overallFill" style="width:0%"></div>
      </div>
      <span id="overallPct">0%</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">🌙</button>
  </div>
</header>

<div class="sidebar-overlay" id="overlay"></div>

<aside class="curso-sidebar" id="sidebar" aria-label="Módulos do curso">
  <div class="sidebar-header">
    <h2 class="sidebar-title">📚 Módulos</h2>
    <button class="btn btn-secondary btn-sm" id="sidebarClose">✕</button>
  </div>
  <div class="sidebar-overall">
    <div class="progress-track"><div class="progress-fill" id="sidebarFill" style="width:0%"></div></div>
    <span id="sidebarProgress">0 lições concluídas</span>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
</aside>

<main class="curso-main" id="main">
  <!-- lesson view -->
  <div id="lessonView" class="lesson-view">
    <div class="lesson-header">
      <div class="lesson-breadcrumb" id="breadcrumb"></div>
      <h1 class="lesson-title" id="lessonTitle"></h1>
      <div class="lesson-meta">
        <span class="lesson-duration" id="lessonDuration"></span>
        <span id="lessonBadge"></span>
      </div>
    </div>
    <div class="lesson-body anim-fade" id="lessonBody"></div>
    <div class="lesson-footer">
      <button class="btn btn-secondary" id="prevBtn">← Anterior</button>
      <button class="btn btn-success" id="doneBtn">✓ Concluir Lição</button>
      <button class="btn btn-primary" id="nextBtn">Próxima →</button>
    </div>
  </div>

  <!-- module intro view -->
  <div id="moduleView" class="lesson-view hidden">
    <div class="module-intro-card panel" id="moduleCard"></div>
  </div>

  <!-- quiz view -->
  <div id="quizView" class="quiz-view hidden">
    <div class="quiz-header">
      <h2 class="quiz-title" id="quizTitle"></h2>
      <p class="quiz-subtitle">Responda todas as questões para concluir o módulo</p>
      <div class="quiz-progress">
        <span id="quizProgressText">Questão 1 de 1</span>
        <div class="progress-track" style="margin-top:0.4rem;"><div class="progress-fill" id="quizProgressFill" style="width:0%"></div></div>
      </div>
    </div>
    <div id="quizBody"></div>
    <div class="quiz-footer" id="quizFooter">
      <button class="btn btn-primary btn-full" id="confirmBtn">Confirmar Resposta</button>
    </div>
    <div class="quiz-result panel hidden" id="quizResult">
      <div class="quiz-result__score" id="quizScore"></div>
      <p class="quiz-result__msg" id="quizMsg"></p>
      <div class="quiz-result__actions">
        <button class="btn btn-secondary" id="retryBtn">🔄 Repetir Quiz</button>
        <button class="btn btn-primary" id="nextModBtn">Próximo Módulo →</button>
      </div>
    </div>
  </div>

  <!-- certificate teaser -->
  <div id="certTeaser" class="certificate-teaser panel hidden">
    <span class="certificate-teaser__icon">🏆</span>
    <h2>Parabéns! Curso Concluído!</h2>
    <p>Você completou todos os módulos e está apto a emitir seu certificado.</p>
    <a href="certificado.html" class="btn btn-primary btn-lg" style="margin-top:0.5rem;">🏅 Gerar Certificado</a>
  </div>
</main>

<script src="app.js"></script>
<script src="conteudo-part1.js"></script>
<script src="conteudo-part2.js"></script>
<script src="conteudo-part3.js"></script>
<script src="conteudo-part4.js"></script>
<script src="conteudo-part5.js"></script>
<script src="conteudo.js"></script>
<script>
(function() {
  'use strict';

  // theme toggle
  CourseApp.initTheme();
  var themeBtn = document.getElementById('themeToggle');
  function updateThemeBtn() { themeBtn.textContent = CourseApp.getTheme() === 'dark' ? '🌙' : '☀️'; }
  updateThemeBtn();
  themeBtn.addEventListener('click', function() {
    CourseApp.setTheme(CourseApp.getTheme() === 'dark' ? 'light' : 'dark');
    updateThemeBtn();
  });

  function qs(sel, ctx) { return (ctx||document).querySelector(sel); }
  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  // ─── routing ───────────────────────────────────────────────────────────────────
  // Hash formats: #m1  (module intro)  |  #m1/l1  (lesson)  |  #m1/quiz  (quiz)
  function parseHash() {
    const h = location.hash.slice(1) || 'm1';
    const parts = h.split('/');
    const mId = parseInt(parts[0].replace('m',''), 10) || 1;
    const sub  = parts[1] || null;
    return { mId, sub };
  }

  function go(mId, sub) {
    const newHash = sub ? `#m${mId}/${sub}` : `#m${mId}`;
    if (location.hash !== newHash) location.hash = newHash;
    else render();
  }

  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', function() {
    // Redirect to register if no user
    if (!CourseApp.hasUser()) { location.href = 'index.html'; return; }
    buildSidebar();
    render();
    updateOverall();
  });

  // ─── render dispatcher ────────────────────────────────────────────────────────────────
  function render() {
    const { mId, sub } = parseHash();
    const mod = COURSE_DATA.modules.find(m => m.id === mId);
    if (!mod) { go(1); return; }

    hide(qs('#lessonView'));
    hide(qs('#moduleView'));
    hide(qs('#quizView'));
    hide(qs('#certTeaser'));

    if (!sub) {
      renderModuleIntro(mod);
    } else if (sub === 'quiz') {
      renderQuiz(mod);
    } else {
      const lId = parseInt(sub.replace('l',''), 10);
      const lesson = mod.lessons.find(l => l.id === lId);
      if (lesson) renderLesson(mod, lesson);
      else renderModuleIntro(mod);
    }

    updateSidebar(mId, sub);
    updateOverall();
  }

  // ─── module intro ────────────────────────────────────────────────────────────────────
  function renderModuleIntro(mod) {
    show(qs('#moduleView'));
    const p = CourseApp.getProgress();
    const pct = p.modulePercent(mod.id);
    const card = document.getElementById('moduleCard');
    card.innerHTML = `
      <span class="module-intro-icon">${mod.icon}</span>
      <p class="module-intro-label">Módulo ${mod.id}</p>
      <h2 class="module-intro-title">${mod.title}</h2>
      <p class="module-intro-desc">${mod.description}</p>
      <div class="progress-track" style="margin:0 auto 1rem;max-width:300px;">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <p style="font-size:.875rem;color:var(--text-muted);margin-bottom:1.25rem;">${pct}% concluído</p>
      <button class="btn btn-primary btn-lg" onclick="startModule(${mod.id})">
        ${pct > 0 ? '▶ Continuar Módulo' : '▶ Iniciar Módulo'}
      </button>
      <div class="module-lessons-list">
        <h3>Lições deste módulo</h3>
        ${mod.lessons.map(l => {
          const done = p.isLessonDone(mod.id, l.id);
          return `<div class="module-lesson-item ${done?'done':''}" onclick="location.hash='#m${mod.id}/l${l.id}'">
            <span>${done ? '✓' : '○'}</span>
            <span>${mod.id}.${l.id} ${l.title}</span>
            <span style="font-size:.8125rem;color:var(--text-muted);margin-left:auto">${l.duration}</span>
          </div>`;
        }).join('')}
        <div class="module-lesson-item ${p.isQuizPassed(mod.id)?'done':''}" onclick="location.hash='#m${mod.id}/quiz'"
             style="color:var(--blue)">
          <span>${p.isQuizPassed(mod.id) ? '✓' : '📝'}</span>
          <span>Quiz do Módulo ${mod.id}</span>
        </div>
      </div>`;
    document.getElementById('topbarTitle').textContent = `Módulo ${mod.id} — ${mod.title}`;
  }

  window.startModule = function(mId) {
    const mod = COURSE_DATA.modules.find(m => m.id === mId);
    if (!mod) return;
    const p = CourseApp.getProgress();
    // Find first uncompleted lesson
    const first = mod.lessons.find(l => !p.isLessonDone(mId, l.id));
    if (first) go(mId, 'l' + first.id);
    else go(mId, 'quiz');
  };

  // ─── lesson render ────────────────────────────────────────────────────────────────────
  function renderLesson(mod, lesson) {
    show(qs('#lessonView'));
    const p = CourseApp.getProgress();
    const isDone = p.isLessonDone(mod.id, lesson.id);

    document.getElementById('breadcrumb').textContent = `Módulo ${mod.id} › Lição ${mod.id}.${lesson.id}`;
    document.getElementById('lessonTitle').textContent = lesson.title;
    document.getElementById('lessonDuration').textContent = `⏱ ${lesson.duration}`;
    document.getElementById('lessonBadge').innerHTML = isDone
      ? '<span class="badge badge-done">✓ Concluída</span>'
      : '<span class="badge badge-current">Em andamento</span>';
    const body = document.getElementById('lessonBody');
    body.innerHTML = lesson.content;
    body.classList.remove('anim-fade');
    void body.offsetWidth;
    body.classList.add('anim-fade');

    document.getElementById('topbarTitle').textContent = `${mod.id}.${lesson.id} ${lesson.title}`;

    // done button
    const doneBtn = document.getElementById('doneBtn');
    if (isDone) {
      doneBtn.textContent = '✓ Concluída';
      doneBtn.className = 'btn btn-success';
    } else {
      doneBtn.textContent = '✓ Concluir Lição';
      doneBtn.className = 'btn btn-primary';
    }
    doneBtn.onclick = function() {
      CourseApp.markLesson(mod.id, lesson.id);
      doneBtn.textContent = '✓ Concluída';
      doneBtn.className = 'btn btn-success';
      document.getElementById('lessonBadge').innerHTML = '<span class="badge badge-done">✓ Concluída</span>';
      updateOverall();
      updateSidebar(mod.id, 'l' + lesson.id);
      // Auto advance after brief delay
      setTimeout(() => { navigateNext(mod, lesson); }, 600);
    };

    // prev/next
    const { prevRoute, nextRoute } = getNavRoutes(mod, lesson);
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    prevBtn.disabled = !prevRoute;
    nextBtn.disabled = !nextRoute;
    prevBtn.onclick = prevRoute ? () => { location.hash = prevRoute; } : null;
    nextBtn.onclick = nextRoute ? () => { location.hash = nextRoute; } : null;
  }

  function navigateNext(mod, lesson) {
    const { nextRoute } = getNavRoutes(mod, lesson);
    if (nextRoute) location.hash = nextRoute;
  }

  function getNavRoutes(mod, lesson) {
    const allMods = COURSE_DATA.modules;
    const mIdx = allMods.findIndex(m => m.id === mod.id);
    const lIdx = mod.lessons.findIndex(l => l.id === lesson.id);

    let prevRoute = null, nextRoute = null;

    if (lIdx > 0) {
      prevRoute = `#m${mod.id}/l${mod.lessons[lIdx-1].id}`;
    } else if (mIdx > 0) {
      const pm = allMods[mIdx-1];
      prevRoute = `#m${pm.id}/quiz`;
    }

    if (lIdx < mod.lessons.length - 1) {
      nextRoute = `#m${mod.id}/l${mod.lessons[lIdx+1].id}`;
    } else {
      nextRoute = `#m${mod.id}/quiz`;
    }

    return { prevRoute, nextRoute };
  }

  // ─── quiz ───────────────────────────────────────────────────────────────────────────
  function renderQuiz(mod) {
    show(qs('#quizView'));
    document.getElementById('quizTitle').textContent = `📝 Quiz — Módulo ${mod.id}: ${mod.title}`;
    document.getElementById('topbarTitle').textContent = `Quiz — Módulo ${mod.id}`;

    const questions = mod.quiz.questions;
    let current = 0;
    let answers = new Array(questions.length).fill(null);
    let submitted = false;

    hide(document.getElementById('quizResult'));
    show(document.getElementById('quizFooter'));

    function renderQ(idx) {
      const q = questions[idx];
      document.getElementById('quizProgressText').textContent = `Questão ${idx+1} de ${questions.length}`;
      document.getElementById('quizProgressFill').style.width = `${((idx+1)/questions.length)*100}%`;

      document.getElementById('quizBody').innerHTML = `
        <div class="question-card panel anim-fade">
          <p class="question-number">Questão ${idx+1} de ${questions.length}</p>
          <p class="question-text">${q.text}</p>
          <div class="question-options" id="opts">
            ${q.options.map((o,i) => `
              <button class="question-option ${answers[idx]===i?'selected':''}" data-i="${i}">${String.fromCharCode(65+i)}) ${o.text}</button>
            `).join('')}
          </div>
          <div class="question-feedback hidden" id="qfb"></div>
        </div>`;

      document.getElementById('opts').querySelectorAll('.question-option').forEach(btn => {
        btn.addEventListener('click', function() {
          if (submitted) return;
          answers[idx] = parseInt(this.dataset.i, 10);
          document.getElementById('opts').querySelectorAll('.question-option')
            .forEach(b => b.classList.toggle('selected', b === this));
        });
      });

      const confirmBtn = document.getElementById('confirmBtn');
      confirmBtn.textContent = 'Confirmar Resposta';
      submitted = false;
    }

    document.getElementById('confirmBtn').onclick = function() {
      if (!submitted) {
        if (answers[current] === null) {
          this.classList.add('anim-fade');
          return;
        }
        // show feedback
        submitted = true;
        const q = questions[current];
        const correct = q.options[answers[current]].correct;
        const fb = document.getElementById('qfb');
        fb.innerHTML = correct
          ? `<div class="alert alert-success">✅ <strong>Correto!</strong> ${q.explanation}</div>`
          : `<div class="alert alert-danger">❌ <strong>Incorreto.</strong> ${q.explanation}</div>`;
        fb.classList.remove('hidden');
        // style options
        document.getElementById('opts').querySelectorAll('.question-option').forEach((btn, i) => {
          btn.disabled = true;
          if (q.options[i].correct) btn.classList.add('correct');
          else if (i === answers[current]) btn.classList.add('wrong');
        });
        this.textContent = current < questions.length - 1 ? 'Próxima Questão →' : 'Ver Resultado';
      } else {
        current++;
        if (current < questions.length) {
          renderQ(current);
        } else {
          showResult();
        }
      }
    };

    function showResult() {
      hide(document.getElementById('quizFooter'));
      const score = answers.filter((a,i) => a !== null && questions[i].options[a].correct).length;
      const total = questions.length;
      const passed = CourseApp.saveQuiz(mod.id, score, total);
      const pct = Math.round((score/total)*100);

      document.getElementById('quizScore').textContent = `${score}/${total} — ${pct}%`;
      document.getElementById('quizMsg').textContent = passed
        ? `🎉 Aprovado! Mínimo de 60% atingido. Módulo concluído!`
        : `😓 Você precisa de pelo menos 60% para avançar. Tente novamente!`;
      document.getElementById('quizMsg').style.color = passed ? 'var(--green)' : 'var(--red)';

      const result = document.getElementById('quizResult');
      show(result);
      result.classList.add('anim-fade');

      const nextModBtn = document.getElementById('nextModBtn');
      if (!passed) {
        nextModBtn.disabled = true;
        nextModBtn.textContent = 'Repetir para avançar';
      } else {
        nextModBtn.disabled = false;
        const nextMod = COURSE_DATA.modules.find(m => m.id === mod.id + 1);
        if (nextMod) {
          nextModBtn.textContent = `Módulo ${nextMod.id}: ${nextMod.title} →`;
          nextModBtn.onclick = () => { location.hash = `#m${nextMod.id}`; };
        } else {
          nextModBtn.textContent = '🏆 Ver Certificado';
          nextModBtn.onclick = () => { location.href = 'certificado.html'; };
          // show cert teaser
          hide(qs('#quizView'));
          show(document.getElementById('certTeaser'));
        }
        updateOverall();
        updateSidebar(mod.id, 'quiz');
      }

      document.getElementById('retryBtn').onclick = () => {
        hide(result);
        show(document.getElementById('quizFooter'));
        current = 0;
        answers = new Array(questions.length).fill(null);
        submitted = false;
        renderQ(0);
      };
    }

    renderQ(0);
  }

  // ─── sidebar ───────────────────────────────────────────────────────────────────────────
  function buildSidebar() {
    const nav = document.getElementById('sidebarNav');
    nav.innerHTML = COURSE_DATA.modules.map(mod => `
      <div class="sidebar-module" data-mid="${mod.id}">
        <button class="sidebar-module__header" aria-expanded="false" data-mid="${mod.id}">
          <span class="sidebar-module__icon">${mod.icon}</span>
          <span class="sidebar-module__title">Módulo ${mod.id}</span>
          <span class="sidebar-module__chevron">▶</span>
        </button>
        <div class="sidebar-lessons hidden" id="sl-${mod.id}">
          ${mod.lessons.map(l => `
            <a class="sidebar-lesson" href="#m${mod.id}/l${l.id}" id="sl-${mod.id}-${l.id}">
              <span class="sidebar-lesson-icon">○</span>
              <span>${mod.id}.${l.id} ${l.title}</span>
            </a>`).join('')}
          <a class="sidebar-lesson sidebar-lesson-quiz" href="#m${mod.id}/quiz" id="sl-${mod.id}-quiz">
            <span class="sidebar-lesson-icon">📝</span>
            <span>Quiz do Módulo ${mod.id}</span>
          </a>
        </div>
      </div>`).join('');

    nav.querySelectorAll('.sidebar-module__header').forEach(btn => {
      btn.addEventListener('click', function() {
        const mid = this.dataset.mid;
        const lessons = document.getElementById('sl-' + mid);
        const expanded = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', !expanded);
        this.querySelector('.sidebar-module__chevron').textContent = expanded ? '▶' : '▼';
        lessons.classList.toggle('hidden', expanded);
      });
    });

    // close sidebar on lesson click (mobile)
    nav.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        if (window.innerWidth < 1024) closeSidebar();
      });
    });
  }

  function updateSidebar(activeMid, activeSub) {
    const p = CourseApp.getProgress();
    COURSE_DATA.modules.forEach(mod => {
      mod.lessons.forEach(l => {
        const el = document.getElementById(`sl-${mod.id}-${l.id}`);
        if (!el) return;
        const done = p.isLessonDone(mod.id, l.id);
        el.classList.toggle('done', done);
        el.classList.toggle('active', mod.id === activeMid && activeSub === 'l'+l.id);
        el.querySelector('.sidebar-lesson-icon').textContent = done ? '✓' : '○';
      });
      const qEl = document.getElementById(`sl-${mod.id}-quiz`);
      if (qEl) {
        const passed = p.isQuizPassed(mod.id);
        qEl.classList.toggle('done', passed);
        qEl.classList.toggle('active', mod.id === activeMid && activeSub === 'quiz');
        qEl.querySelector('.sidebar-lesson-icon').textContent = passed ? '✓' : '📝';
      }
    });

    // expand active module
    const btn = document.querySelector(`.sidebar-module__header[data-mid="${activeMid}"]`);
    if (btn && btn.getAttribute('aria-expanded') !== 'true') {
      btn.click();
    }
  }

  function updateOverall() {
    const p = CourseApp.getProgress();
    document.getElementById('overallFill').style.width = p.overallPct + '%';
    document.getElementById('overallPct').textContent = p.overallPct + '%';
    document.getElementById('sidebarFill').style.width = p.overallPct + '%';
    document.getElementById('sidebarProgress').textContent = `${p.totalDone} de ${p.totalLessons} lições`;
  }

  // ─── sidebar toggle ─────────────────────────────────────────────────────────────────────────
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('visible');
    document.documentElement.style.setProperty('--sidebar-open', '1');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('visible');
    document.documentElement.style.removeProperty('--sidebar-open');
  }
  document.getElementById('sidebarToggle').addEventListener('click', openSidebar);
  document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
  document.getElementById('overlay').addEventListener('click', closeSidebar);
})();
</script>
</body>
</html>
