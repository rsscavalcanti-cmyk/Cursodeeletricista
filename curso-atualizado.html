<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aulas — Eletricista Predial com Energia Desligada</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="theme.js"></script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="light-theme.css">
<style>
.course-shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.course-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 1rem;background:var(--bg-panel);border-bottom:1px solid var(--border-dim);backdrop-filter:blur(18px)}.brand{font-weight:800;color:var(--accent)}.bar-actions{display:flex;align-items:center;gap:.6rem}.theme-toggle{min-width:120px}.layout{display:grid;min-height:calc(100vh - 62px)}.menu{background:var(--bg-secondary);border-right:1px solid var(--border-dim);padding:1rem;overflow-y:auto}.content{padding:1rem;overflow-y:auto}.safe-note{max-width:840px;margin:0 auto 1.25rem;padding:1rem 1.15rem;background:var(--green-dim);border-left:4px solid var(--green);border-radius:var(--radius-md);font-size:.9rem;color:var(--text-secondary)}.safe-note strong{display:block;color:var(--text-primary)}.mod-btn{width:100%;border:1px solid var(--border-dim);background:var(--bg-panel);border-radius:var(--radius-md);padding:.7rem;text-align:left;color:var(--text-primary);font-weight:600;margin-bottom:.5rem;cursor:pointer}.mod-btn.active{border-color:var(--accent);background:var(--accent-dim)}.lesson-links{display:none;padding:0 .3rem .8rem}.lesson-links.open{display:block}.lesson-link{display:block;color:var(--text-secondary);font-size:.84rem;padding:.4rem .55rem;border-radius:var(--radius-sm)}.lesson-link:hover,.lesson-link.active{background:var(--accent-dim);color:var(--accent)}.stage{max-width:840px;margin:0 auto}.stage h1{font-size:clamp(1.45rem,4vw,2rem);margin-bottom:.45rem}.meta{color:var(--text-muted);font-size:.85rem;margin-bottom:1.5rem}.lesson-body{line-height:1.72}.lesson-body .lesson-visual{display:grid;gap:1rem;align-items:center;padding:1rem;margin:1rem 0}.lesson-visual img{width:100%;max-height:230px;object-fit:contain}.controls{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin:2rem 0}.module-home{text-align:center;padding:1.5rem}.module-home img{width:100%;max-width:460px;border-radius:var(--radius-lg);margin:0 auto 1.2rem;border:1px solid var(--border-dim)}.video-card{padding:1rem;margin-top:1rem;text-align:left}.quiz-card{padding:1.2rem}.choice{display:block;width:100%;padding:.8rem;margin:.5rem 0;background:var(--bg-input);border:1px solid var(--border-mid);border-radius:var(--radius-md);color:var(--text-primary);text-align:left;cursor:pointer}.choice.selected{border-color:var(--accent);background:var(--accent-dim)}.progress-mini{font-size:.8rem;color:var(--text-muted)}@media(min-width:900px){.layout{grid-template-columns:290px 1fr}.content{padding:1.6rem 2rem}}@media(max-width:899px){.layout{display:block}.menu{max-height:235px;border-right:0;border-bottom:1px solid var(--border-dim)}.content{min-height:calc(100vh - 297px)}}
</style>
</head>
<body class="course-shell">
<header class="course-bar"><a class="brand" href="index.html">⚡ Eletricista Predial</a><div class="bar-actions"><span class="progress-mini" id="overall">0%</span><button class="btn btn-secondary btn-sm theme-toggle" data-theme-toggle>☀️ Tema claro</button></div></header>
<div class="layout"><aside class="menu"><h2 style="font-size:1rem;margin-bottom:.75rem">📚 Módulos</h2><nav id="nav"></nav></aside><main class="content"><div class="safe-note"><strong>🛡️ Regra permanente</strong>Toda atividade orientada neste ambiente pressupõe instalação desligada, bloqueada, sinalizada e com ausência de tensão confirmada.</div><div class="stage" id="stage"></div></main></div>
<script src="app.js"></script><script src="conteudo.js"></script><script src="conteudo-revisao-lite.js"></script>
<script>
(function(){'use strict';
if(!CourseApp.hasUser()){location.href='index.html';return;}
var nav=document.getElementById('nav'),stage=document.getElementById('stage');
var visuals={1:'assets/loto.svg',2:'assets/kit-ferramentas.svg',3:'assets/materiais-eletricos.svg',4:'assets/hero-seguranca.svg',5:'assets/multimetro-zero.svg',6:'assets/materiais-eletricos.svg',7:'assets/loto.svg'};
function hash(){var p=(location.hash.slice(1)||'m1').split('/');return{m:Number(p[0].replace('m',''))||1,s:p[1]||''};}
function progress(){var p=CourseApp.getProgress();document.getElementById('overall').textContent='Progresso: '+p.overallPct+'%';return p;}
function buildNav(){var r=hash(),p=progress();nav.innerHTML=COURSE_DATA.modules.map(function(m){return '<button class="mod-btn '+(r.m===m.id?'active':'')+'" onclick="location.hash=\'#m'+m.id+'\'">'+m.icon+' Módulo '+m.id+' — '+m.title+'</button><div class="lesson-links '+(r.m===m.id?'open':'')+'">'+m.lessons.map(function(l){return '<a class="lesson-link '+(r.m===m.id&&r.s==='l'+l.id?'active':'')+'" href="#m'+m.id+'/l'+l.id+'">'+(p.isLessonDone(m.id,l.id)?'✓ ':'')+m.id+'.'+l.id+' '+l.title+'</a>';}).join('')+'<a class="lesson-link '+(r.m===m.id&&r.s==='quiz'?'active':'')+'" href="#m'+m.id+'/quiz">📝 Quiz do módulo</a></div>';}).join('');}
function mod(id){return COURSE_DATA.modules.find(function(m){return m.id===id})||COUR_DATA.modules[0];}
function renderModule(m){var p=CourseApp.getProgress();stage.innerHTML='<section class="module-home panel"><img src="'+visuals[m.id]+'" alt="Ilustração do módulo"><p class="badge badge-current">Módulo '+m.id+'</p><h1>'+m.title+'</h1><p style="color:var(--text-secondary);margin:0 auto 1rem;max-width:600px">'+m.description+'</p><div class="progress-track" style="max-width:320px;margin:0 auto 1.3rem"><div class="progress-fill" style="width:'+p.modulePercent(m.id)+'%"></div></div><button class="btn btn-primary btn-lg" id="start">▶ Iniciar / continuar módulo</button></section>';document.getElementById('start').onclick=function(){var first=m.lessons.find(function(l){return !p.isLessonDone(m.id,l.id)});location.hash='#m'+m.id+'/'+(first?'l'+first.id:'quiz');};}
function links(m,l){var i=m.lessons.findIndex(function(x){return x.id===l.id});return{prev:i>0?'#m'+m.id+'/l'+m.lessons[i-1].id:'#m'+m.id,next:i<m.lessons.length-1?'#m'+m.id+'/l'+m.lessons[i+1].id:'#m'+m.id+'/quiz'};}
function renderLesson(m,l){var p=CourseApp.getProgress(),done=p.isLessonDone(m.id,l.id),r=links(m,l);stage.innerHTML='<p class="badge '+(done?'badge-done':'badge-current')+'">'+(done?'✓ Concluída':'Em andamento')+'</p><h1>'+l.title+'</h1><p class="meta">Módulo '+m.id+' · ⏱ '+l.duration+'</p><article class="lesson-body">'+l.content+'</article><div class="controls"><a class="btn btn-secondary" href="'+r.prev+'">← Anterior</a><button class="btn btn-primary" id="done">'+(done?'✓ Concluída':'✓ Concluir lição')+'</button><a class="btn btn-secondary" href="'+r.next+'">Próxima →</a></div>';document.getElementById('done').onclick=function(){CourseApp.markLesson(m.id,l.id);location.hash=r.next;};}
function renderQuiz(m){var qs=m.quiz.questions,n=0,answers=[];function show(){var q=qs[n];stage.innerHTML='<section class="quiz-card panel"><p class="badge badge-blue">Quiz · questão '+(n+1)+' de '+qs.length+'</p><h1 style="font-size:1.25rem;margin-top:1rem">'+q.text+'</h1><div id="options">'+q.options.map(function(o,i){return '<button class="choice" data-i="'+i+'">'+String.fromCharCode(65+i)+') '+o.text+'</button>';}).join('')+'</div><button class="btn btn-primary" id="answer" style="margin-top:1rem">Confirmar resposta</button><div id="feedback"></div></section>';var chosen=null;document.querySelectorAll('.choice').forEach(function(b){b.onclick=function(){chosen=Number(this.dataset.i);document.querySelectorAll('.choice').forEach(function(x){x.classList.remove('selected')});this.classList.add('selected');};});document.getElementById('answer').onclick=function(){if(chosen===null)return;answers[n]=chosen;var good=q.options[chosen].correct;document.getElementById('feedback').innerHTML='<div class="alert '+(good?'alert-success':'alert-danger')+'" style="margin-top:1rem">'+(good?'✅ ':'❌ ')+q.explanation+'</div>';this.textContent=n<qs.length-1?'Próxima questão →':'Ver resultado';this.onclick=function(){n++;if(n<qs.length)show();else finish();};};}function finish(){var score=answers.filter(function(a,i){return qs[i].options[a].correct}).length,passed=CourseApp.saveQuiz(m.id,score,qs.length);stage.innerHTML='<section class="quiz-card panel"><h1>Resultado do módulo</h1><p style="font-size:2rem;font-weight:800;color:var(--accent);margin:1rem 0">'+score+'/'+qs.length+'</p><p style="color:var(--text-secondary);margin-bottom:1.5rem">'+(passed?'Módulo concluído.':'Revise as aulas e refaça o quiz para avançar.')+'</p>'+(passed&&m.id<COURSE_DATA.modules.length?'<a class="btn btn-primary" href="#m'+(m.id+1)+'">Próximo módulo →</a>':'<a class="btn btn-secondary" href="#m'+m.id+'">Voltar ao módulo</a>')+'</section>';buildNav();progress();}show();}
function render(){var r=hash(),m=mod(r.m);buildNav();if(!r.s)renderModule(m);else if(r.s==='quiz')renderQuiz(m);else{var l=m.lessons.find(function(x){return 'l'+x.id===r.s});l?renderLesson(m,l):renderModule(m);}}
window.addEventListener('hashchange',render);render();
})();
</script></body></html>
